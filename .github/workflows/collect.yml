name: 일정 자동 수집

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST (21:17 UTC)
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      games:
        description: "수집할 게임 (비우면 전체) 예: hsr wuwa"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Claude로 최신 일정 수집
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/collect.mjs ${{ github.event.inputs.games }}
      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- data/auto.json; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto.json
          git commit -m "chore: 일정 자동 수집 $(date -u +%Y-%m-%d)"
          git push
